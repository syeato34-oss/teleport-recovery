[build]
  command = "npm run typecheck && npm run lint && npm test && npm run build"
  publish = "dist"

# Exact callback.html POST endpoint must stay free of Pretty URL redirects.
[build.processing.html]
  pretty_urls = false

# Redirect rules normalize away trailing slashes, so a slash-only 301 rule can loop.
# This route-scoped handler inspects the original URL before the static rewrite.
[[edge_functions]]
  function = "canonical-birmingham"
  pattern = "^/(recovery/birmingham|birmingham)/?$"

# These domains must be assigned to this Netlify project and have valid certificates.
[[redirects]]
  from = "http://teleportrecovery.co.uk/*"
  to = "https://teleportrecovery.co.uk/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://www.teleportrecovery.co.uk/*"
  to = "https://teleportrecovery.co.uk/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.teleportrecovery.co.uk/*"
  to = "https://teleportrecovery.co.uk/:splat"
  status = 301
  force = true

# Only known legal and city routes get application entry points. The edge function above
# handles Birmingham slash canonicalisation; these rules resolve its actual HTML file.
[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/terms/index.html"
  to = "/terms"
  status = 301
  force = true

[[redirects]]
  from = "/guarantee/index.html"
  to = "/guarantee"
  status = 301
  force = true

[[redirects]]
  from = "/privacy/index.html"
  to = "/privacy"
  status = 301
  force = true

[[redirects]]
  from = "/terms"
  to = "/terms/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/guarantee"
  to = "/guarantee/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/privacy"
  to = "/privacy/index.html"
  status = 200
  force = true

# Publish additional city routes explicitly, alongside src/config/locations.ts.
[[redirects]]
  from = "/recovery/birmingham/index.html"
  to = "/recovery/birmingham"
  status = 301
  force = true

[[redirects]]
  from = "/recovery/birmingham"
  to = "/recovery/birmingham/index.html"
  status = 200
  force = true

# There is deliberately no /* -> index.html 200 rule. Netlify serves the generated
# 404.html with HTTP 404 for unknown paths and missing assets.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(self), payment=()"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
